---
# Copy to secrets.yml (ignored by git), fill in, then encrypt the whole file:
#   chmod 600 secrets.yml && ansible-vault encrypt secrets.yml
# Use with: -e @secrets.yml --ask-vault-pass
#
# Credentials ONLY. Ansible redacts every value of an encrypted vars file wherever
# that text appears in its output, so keep plain settings (deployment_mode,
# rhsm_builder_register, rhsm_secrets_dir) in settings.yml, and prefer specific
# activation key names (e.g. goose-demo-node-2026 rather than goose).
insights_org_id: ""
insights_activation_key: ""
# Only if the builder should use your Red Hat login instead of the activation key:
# rhsm_builder_username: ""
# rhsm_builder_password: ""
# rhsm_builder_org_id: ""        # only if your login belongs to several orgs

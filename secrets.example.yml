---
# Copy to secrets.yml (ignored by git) and fill in. Use with -e @secrets.yml
# Optionally encrypt:  ansible-vault encrypt secrets.yml  (then add --ask-vault-pass)
rhsm_secrets_dir: "/etc/goose/rhsm-secrets"   # only needed on non-RHEL build hosts
# ...or, instead of rhsm_secrets_dir, let the playbook fetch build entitlement
# with your Red Hat account (leave rhsm_secrets_dir empty or delete the line):
# rhsm_builder_register: true
# rhsm_builder_username: ""     # optional; otherwise the activation key below is used
# rhsm_builder_password: ""
insights_org_id: ""
insights_activation_key: ""
